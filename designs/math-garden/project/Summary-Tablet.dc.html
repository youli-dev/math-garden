<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>数学花园 · 平板本局总结</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+SC:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: "Noto Sans SC", sans-serif;
      color: #213D37;
      background-color: #FFF8EA;
      background-image: radial-gradient(#E9DDC8 0.9px, transparent 0.9px);
      background-size: 20px 20px;
    }
    button { font: inherit; cursor: pointer; }
    a { color: #213D37; }
    a:hover { color: #8E344D; }
  </style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; position: relative; overflow: hidden; padding: 22px 28px 23px; display: flex; flex-direction: column; gap: 15px">
  <svg aria-hidden="true" viewBox="0 0 240 165" style="position: absolute; width: 240px; height: 165px; right: -44px; bottom: -44px; opacity: 0.95">
    <path d="M19 162C53 112 91 108 126 128C91 153 70 169 34 181Z" fill="#F2C0C5"/>
    <path d="M72 169C105 128 142 125 182 141C151 169 123 181 95 188Z" fill="#B8DCC7"/>
    <path d="M150 172C180 141 210 137 240 151C218 174 188 188 164 194Z" fill="#F3D47A"/>
  </svg>
  <header style="display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 48px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div aria-hidden="true" style="width: 46px; height: 46px; border-radius: 16px 16px 16px 5px; background: #E85E77; display: grid; place-items: center; box-shadow: 0 4px 0 #B73A57">
        <svg viewBox="0 0 30 30" style="width: 27px; height: 27px">
          <circle cx="15" cy="9" r="6" fill="#FFF5E7"/>
          <circle cx="9" cy="15" r="6" fill="#FFF5E7"/>
          <circle cx="21" cy="15" r="6" fill="#FFF5E7"/>
          <circle cx="15" cy="21" r="6" fill="#FFF5E7"/>
          <circle cx="15" cy="15" r="5" fill="#F4B742"/>
        </svg>
      </div>
      <div>
        <div style="font-family: 'Baloo 2', 'Noto Sans SC', sans-serif; font-size: 25px; line-height: 25px; font-weight: 800; letter-spacing: -0.4px">数学花园</div>
        <div style="font-size: 12px; line-height: 16px; font-weight: 800; letter-spacing: 0.06em; color: #56766E">本局完成</div>
      </div>
    </div>
    <a href="Main.dc.html" aria-label="关闭总结，返回答题" style="width: 44px; height: 44px; border: 2px solid #CFE1D5; border-radius: 999px; background: #FFFFFFB8; display: grid; place-items: center; text-decoration: none">
      <svg aria-hidden="true" viewBox="0 0 20 20" style="width: 18px; height: 18px; fill: none; stroke: #213D37; stroke-width: 2.2; stroke-linecap: round">
        <path d="M5 5L15 15M15 5L5 15"/>
      </svg>
    </a>
  </header>

  <main style="min-height: 0; flex-grow: 1; display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(340px, 0.82fr); gap: 18px">
    <section style="min-width: 0; padding: 25px 28px 23px; border: 2px solid #D7DFD5; border-radius: 30px; background: #FFFFFCF2; box-shadow: 0 7px 0 #E8DFCF; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden">
      <svg aria-hidden="true" viewBox="0 0 170 90" style="position: absolute; width: 170px; height: 90px; right: 22px; top: 18px; opacity: 0.7">
        <path d="M8 70C33 13 75 8 107 31C130 48 139 66 161 78" fill="none" stroke="#DCE8DD" stroke-width="2" stroke-dasharray="4 8" stroke-linecap="round"/>
        <circle cx="40" cy="30" r="4" fill="#F3D47A"/>
        <circle cx="84" cy="17" r="4" fill="#F2BBC2"/>
        <circle cx="130" cy="49" r="4" fill="#A8D4BD"/>
        <circle cx="157" cy="75" r="4" fill="#E85E77"/>
      </svg>
      <div>
        <div style="font-size: 12px; line-height: 16px; font-weight: 900; letter-spacing: 0.08em; color: #198B82">你的花园开花了</div>
        <h1 style="margin: 6px 0 6px; font-family: 'Baloo 2', 'Noto Sans SC', sans-serif; font-size: 48px; line-height: 49px; letter-spacing: -1.1px; max-width: 550px; color: #213D37">你种出了 16 朵花！</h1>
        <p style="margin: 0; max-width: 500px; font-size: 16px; line-height: 23px; font-weight: 700; color: #56766E">两个小难点，已经变成下次的线索。会思考的孩子，就是这样一点点变强的。</p>
      </div>

      <div style="display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 18px; align-items: stretch">
        <div style="padding: 18px; border: 2px solid #F1DFB7; border-radius: 24px; background: #FFF8E3; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center">
          <div style="font-family: 'Baloo 2', sans-serif; font-size: 66px; line-height: 58px; font-weight: 800; color: #E85E77">16</div>
          <div style="margin-top: 4px; font-size: 13px; font-weight: 900; letter-spacing: 0.06em; color: #78633D">共 18 题</div>
          <div style="margin-top: 11px; display: flex; gap: 4px">
            <div style="width: 8px; height: 8px; border-radius: 50%; background: #E85E77"></div>
            <div style="width: 8px; height: 8px; border-radius: 50%; background: #F4B742"></div>
            <div style="width: 8px; height: 8px; border-radius: 50%; background: #55B79D"></div>
          </div>
        </div>
        <div style="min-width: 0; padding: 18px; border: 2px solid #DDE8DC; border-radius: 24px; background: #F7FAF3; display: flex; flex-direction: column; gap: 9px">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
            <div style="font-family: 'Baloo 2', 'Noto Sans SC', sans-serif; font-size: 20px; line-height: 23px; font-weight: 800">你的题目地图</div>
            <div style="font-size: 11px; font-weight: 900; color: #6C8178">18 个站点</div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 7px">
            <sc-for list="{{ questionMap }}" as="item" hint-placeholder-count="18">
              <div aria-label="{{ item.label }}" style="{{ item.style }}">
                <svg viewBox="0 0 20 20" aria-hidden="true" style="width: 17px; height: 17px">
                  <circle cx="10" cy="7" r="4.2" fill="{{ item.petal }}"/>
                  <circle cx="6.5" cy="10" r="4.2" fill="{{ item.petal }}"/>
                  <circle cx="13.5" cy="10" r="4.2" fill="{{ item.petal }}"/>
                  <circle cx="10" cy="13" r="4.2" fill="{{ item.petal }}"/>
                  <circle cx="10" cy="10" r="3" fill="{{ item.center }}"/>
                </svg>
              </div>
            </sc-for>
          </div>
          <div style="margin-top: auto; display: flex; align-items: center; gap: 16px; font-size: 11px; font-weight: 800; color: #647A72">
            <div style="display: flex; align-items: center; gap: 5px"><div style="width: 8px; height: 8px; border-radius: 50%; background: #55B79D"></div>答对</div>
            <div style="display: flex; align-items: center; gap: 5px"><div style="width: 8px; height: 8px; border-radius: 50%; background: #E85E77"></div>再练一次</div>
          </div>
        </div>
      </div>

      <div style="margin-top: auto; display: flex; align-items: center; gap: 10px">
        <a href="Main.dc.html" style="height: 54px; padding: 0 22px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 17px; background: #213D37; color: #FFF8EA; font-size: 15px; font-weight: 900; text-decoration: none; box-shadow: 0 4px 0 #102B26">
          再种一座新花园
          <svg aria-hidden="true" viewBox="0 0 20 20" style="width: 18px; height: 18px; fill: none; stroke: #FFF8EA; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round">
            <path d="M4 10H16M11 5L16 10L11 15"/>
          </svg>
        </a>
        <a href="Feedback-Tablet.dc.html" style="height: 54px; padding: 0 20px; display: flex; align-items: center; justify-content: center; border: 2px solid #D2DED3; border-radius: 17px; background: #FFFFFF; color: #315D50; font-size: 14px; font-weight: 900; text-decoration: none; box-shadow: 0 4px 0 #DDE6DC">复习 2 道易错题</a>
      </div>
    </section>

    <aside style="min-width: 0; display: flex; flex-direction: column; gap: 13px">
      <section style="padding: 21px 22px; border: 2px solid #D4E4D8; border-radius: 27px; background: #F0F8F1; box-shadow: 0 7px 0 #E1EADF">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <div>
            <div style="font-size: 11px; font-weight: 900; letter-spacing: 0.08em; color: #41806D">今天长出的本领</div>
            <h2 style="margin: 3px 0 0; font-family: 'Baloo 2', 'Noto Sans SC', sans-serif; font-size: 25px; line-height: 28px; font-weight: 800">你的本领</h2>
          </div>
          <div aria-hidden="true" style="width: 41px; height: 41px; border-radius: 14px; background: #F4B742; display: grid; place-items: center; transform: rotate(-4deg)">
            <svg viewBox="0 0 28 28" style="width: 23px; height: 23px">
              <path d="M7 20L14 5L21 20H17L14 14L11 20H7Z" fill="#213D37"/>
              <path d="M9 22H19" stroke="#213D37" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 13px; margin-top: 17px">
          <div>
            <div style="display: flex; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 900"><span>两位数加法</span><span>5 / 5</span></div>
            <div style="height: 9px; margin-top: 6px; border-radius: 999px; background: #D9E9DB; overflow: hidden"><div style="width: 100%; height: 100%; background: #198B82; border-radius: 999px"></div></div>
          </div>
          <div>
            <div style="display: flex; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 900"><span>两位数减法</span><span>5 / 5</span></div>
            <div style="height: 9px; margin-top: 6px; border-radius: 999px; background: #D9E9DB; overflow: hidden"><div style="width: 100%; height: 100%; background: #198B82; border-radius: 999px"></div></div>
          </div>
          <div>
            <div style="display: flex; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 900"><span>找缺失的数字</span><span>3 / 4</span></div>
            <div style="height: 9px; margin-top: 6px; border-radius: 999px; background: #F1DED7; overflow: hidden"><div style="width: 75%; height: 100%; background: #E85E77; border-radius: 999px"></div></div>
          </div>
          <div>
            <div style="display: flex; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 900"><span>进位加法</span><span>3 / 4</span></div>
            <div style="height: 9px; margin-top: 6px; border-radius: 999px; background: #F1DED7; overflow: hidden"><div style="width: 75%; height: 100%; background: #E85E77; border-radius: 999px"></div></div>
          </div>
        </div>
      </section>

      <section style="padding: 20px 21px; border: 2px solid #F0D6D5; border-radius: 27px; background: #FFF4F1; box-shadow: 0 7px 0 #EADAD2; display: flex; flex-direction: column; gap: 12px; flex-grow: 1">
        <div style="display: flex; align-items: center; gap: 11px">
          <div aria-hidden="true" style="width: 44px; height: 46px; flex: 0 0 auto">
            <svg viewBox="0 0 50 56" style="width: 44px; height: 46px">
              <path d="M25 22C14 22 9 29 11 41C13 50 20 54 26 54C34 54 40 48 40 38C40 28 35 22 25 22Z" fill="#E85E77"/>
              <circle cx="20" cy="34" r="2.3" fill="#213D37"/>
              <circle cx="32" cy="34" r="2.3" fill="#213D37"/>
              <path d="M22 41C24 43 28 43 30 41" fill="none" stroke="#213D37" stroke-width="2" stroke-linecap="round"/>
              <path d="M20 23C16 17 18 11 23 6C27 12 27 18 24 23" fill="#55B79D"/>
              <path d="M27 22C31 15 36 14 41 16C39 22 34 25 28 24" fill="#198B82"/>
            </svg>
          </div>
          <div>
            <div style="font-size: 11px; font-weight: 900; letter-spacing: 0.06em; color: #A1495D">小芽的提醒</div>
            <div style="font-family: 'Baloo 2', 'Noto Sans SC', sans-serif; font-size: 22px; line-height: 25px; font-weight: 800">下次记得找一个新的十。</div>
          </div>
        </div>
        <div style="padding: 14px 15px; border-radius: 17px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 13px">
          <div style="font-family: 'Baloo 2', sans-serif; font-size: 28px; font-weight: 800">7 + 6</div>
          <div style="font-size: 21px; font-weight: 900; color: #E85E77">=</div>
          <div style="padding: 6px 10px; border-radius: 11px; background: #EAF6EE; font-family: 'Baloo 2', sans-serif; font-size: 27px; font-weight: 800; color: #167C73">13</div>
        </div>
        <div style="font-size: 13px; line-height: 19px; font-weight: 800; color: #6B5555">把 13 里的一个十进到十位，你就差这一小步。</div>
      </section>
    </aside>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const misses = new Set([10, 16]);
    const questionMap = Array.from({ length: 18 }, (_, index) => {
      const missed = misses.has(index);
      return {
        label: '第 ' + (index + 1) + ' 题，' + (missed ? '再练一次' : '答对'),
        petal: missed ? '#F1B6B6' : '#A8D6BC',
        center: missed ? '#E85E77' : '#198B82',
        style: 'height: 34px; display: grid; place-items: center; border-radius: 11px; background: ' + (missed ? '#FFF0EE' : '#F0F8F2') + ';'
      };
    });
    return { questionMap };
  }
}
</script>
</body>
</html>
