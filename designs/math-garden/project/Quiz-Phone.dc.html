<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>数学花园 · 手机答题</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+SC:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: "Noto Sans SC", sans-serif;
      color: #213D37;
      background-color: #FFF8EA;
      background-image: radial-gradient(#E9DDC8 0.9px, transparent 0.9px);
      background-size: 18px 18px;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: #213D37; }
    a:hover { color: #8E344D; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 12px">
  <svg aria-hidden="true" viewBox="0 0 150 130" style="position: absolute; width: 150px; height: 130px; right: -32px; top: -34px; opacity: 0.92">
    <path d="M53 108C23 91 5 105 3 134C34 146 58 133 73 108C94 132 120 126 132 102C107 86 79 88 53 108Z" fill="#DCECE1"/>
    <path d="M70 107C68 77 89 58 116 64C117 93 98 107 77 112" fill="#A9D5BE"/>
    <path d="M70 107C53 79 31 76 14 92C26 114 48 121 71 111" fill="#F5B6BE"/>
  </svg>
  <header style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="display: flex; align-items: center; gap: 9px">
      <div aria-hidden="true" style="width: 38px; height: 38px; border-radius: 13px 13px 13px 4px; background: #E85E77; display: grid; place-items: center; box-shadow: 0 3px 0 #B73A57">
        <svg viewBox="0 0 30 30" style="width: 23px; height: 23px">
          <circle cx="15" cy="9" r="6" fill="#FFF5E7"/>
          <circle cx="9" cy="15" r="6" fill="#FFF5E7"/>
          <circle cx="21" cy="15" r="6" fill="#FFF5E7"/>
          <circle cx="15" cy="21" r="6" fill="#FFF5E7"/>
          <circle cx="15" cy="15" r="5" fill="#F4B742"/>
        </svg>
      </div>
      <div style="font-family: 'Baloo 2', 'Noto Sans SC', sans-serif; font-size: 22px; line-height: 22px; font-weight: 800; letter-spacing: -0.4px">数学花园</div>
    </div>
    <button aria-label="暂停答题" style="width: 42px; height: 42px; border: 2px solid #D1E1D6; border-radius: 14px; background: #FFFFFFC9; display: grid; place-items: center">
      <svg aria-hidden="true" viewBox="0 0 20 20" style="width: 17px; height: 17px; fill: #213D37">
        <rect x="5" y="4" width="3.5" height="12" rx="1.2"/>
        <rect x="11.5" y="4" width="3.5" height="12" rx="1.2"/>
      </svg>
    </button>
  </header>

  <section aria-label="答题进度" style="padding: 9px 12px; border: 2px solid #DDE7D7; border-radius: 16px; background: #FFFDF7E8; display: flex; align-items: center; gap: 10px; box-shadow: 0 3px 0 #EEE5D2">
    <div style="font-size: 10px; font-weight: 900; letter-spacing: 0.05em; color: #56766E; white-space: nowrap">花园小径</div>
    <div style="display: flex; align-items: center; gap: 5px; flex-grow: 1">
      <sc-for list="{{ trail }}" as="item" hint-placeholder-count="8">
        <div aria-label="{{ item.label }}" style="{{ item.style }}">
          <svg viewBox="0 0 20 20" aria-hidden="true" style="width: 18px; height: 18px">
            <circle cx="10" cy="7" r="4.3" fill="{{ item.petal }}"/>
            <circle cx="6.4" cy="10.1" r="4.3" fill="{{ item.petal }}"/>
            <circle cx="13.6" cy="10.1" r="4.3" fill="{{ item.petal }}"/>
            <circle cx="10" cy="13" r="4.3" fill="{{ item.petal }}"/>
            <circle cx="10" cy="10" r="3.1" fill="{{ item.center }}"/>
          </svg>
        </div>
      </sc-for>
    </div>
    <div style="font-size: 12px; font-weight: 900; white-space: nowrap">6/18</div>
  </section>

  <main style="min-height: 0; display: flex; flex-direction: column; gap: 12px">
    <section style="padding: 17px 17px 15px; border: 2px solid #D7DFD5; border-radius: 24px; background: #FFFFFCF2; box-shadow: 0 5px 0 #E8DFCF; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
        <div>
          <div style="font-size: 10px; font-weight: 900; letter-spacing: 0.06em; color: #198B82">两位数加法</div>
          <div style="margin-top: 3px; font-family: 'Baloo 2', 'Noto Sans SC', sans-serif; font-size: 24px; line-height: 26px; font-weight: 800">算一算：47 + 26</div>
        </div>
        <div style="padding: 5px 8px; border-radius: 999px; background: #EAF4EC; color: #315D50; font-size: 10px; font-weight: 900; white-space: nowrap">先整十</div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 4px 2px">
        <div style="display: flex; align-items: center; gap: 11px; font-family: 'Baloo 2', sans-serif; font-size: 44px; line-height: 1; font-weight: 800">
          <span>47</span>
          <span style="color: #E85E77">+</span>
          <span>26</span>
          <span style="color: #A8B6AD">=</span>
        </div>
        <label for="phone-answer" style="position: relative">
          <span style="position: absolute; top: -14px; left: 9px; font-size: 8px; font-weight: 900; letter-spacing: 0.05em; color: #56766E">答案</span>
          <input id="phone-answer" value="{{ entered }}" inputmode="numeric" aria-label="你的答案" placeholder="?" style="width: 88px; height: 61px; box-sizing: border-box; border: 2px solid #198B82; border-radius: 16px; outline: 0; background: #F3FBF5; color: #213D37; font-family: 'Baloo 2', 'Noto Sans SC', sans-serif; font-size: 38px; line-height: 1; font-weight: 800; text-align: center; box-shadow: inset 0 -4px 0 #D7EEE0, 0 3px 0 #B7D9C5">
        </label>
      </div>
      <button onClick="{{ toggleHelper }}" style="min-height: 38px; padding: 0 11px; border: 1.5px solid #C6DCCB; border-radius: 13px; background: #F2F8F1; color: #315D50; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <span style="display: flex; align-items: center; gap: 7px">
          <svg aria-hidden="true" viewBox="0 0 20 20" style="width: 15px; height: 15px; fill: none; stroke: #198B82; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round">
            <path d="M7 16H13M8 19H12"/>
            <path d="M6 4H14V6C14 9 12 11 10 13C8 11 6 9 6 6V4Z"/>
            <path d="M6 6H3C3 9 5 11 7 11M14 6H17C17 9 15 11 13 11"/>
          </svg>
          需要小提示吗？
        </span>
        <span aria-hidden="true" style="font-size: 15px">+</span>
      </button>
      <sc-if value="{{ helperOpen }}" hint-placeholder-val="{{ false }}">
        <div style="padding: 11px 12px; border-radius: 14px; background: #FFFFFF; border: 1.5px solid #D9E9D9; display: flex; align-items: center; justify-content: space-between; gap: 10px">
          <div style="font-family: 'Baloo 2', 'Noto Sans SC', sans-serif; font-size: 18px; line-height: 21px; font-weight: 800">40 + 20<br>7 + 6</div>
          <div style="height: 34px; width: 1px; background: #E2EAE3"></div>
          <div style="font-size: 11px; line-height: 15px; font-weight: 800; color: #46675E">把两部分<br>合起来。</div>
        </div>
      </sc-if>
    </section>

    <section aria-label="数字键盘" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px">
      <sc-for list="{{ keys }}" as="key" hint-placeholder-count="9">
        <button aria-label="{{ key.label }}" onClick="{{ key.press }}" style="{{ key.style }}">{{ key.label }}</button>
      </sc-for>
      <button aria-label="清空答案" onClick="{{ clear }}" style="height: 47px; border: 2px solid #E3C8C7; border-radius: 14px; background: #FFF4F2; color: #8E344D; font-size: 13px; font-weight: 900; box-shadow: 0 3px 0 #E9D4D1">清空</button>
      <button aria-label="输入零" onClick="{{ zeroPress }}" style="height: 47px; border: 2px solid #D6E3DA; border-radius: 14px; background: #FFFFFF; color: #213D37; font-family: 'Baloo 2', 'Noto Sans SC', sans-serif; font-size: 22px; font-weight: 800; box-shadow: 0 3px 0 #DDE6DE">0</button>
      <button aria-label="删除上一位" onClick="{{ backspace }}" style="height: 47px; border: 2px solid #D6E3DA; border-radius: 14px; background: #FFFFFF; display: grid; place-items: center; box-shadow: 0 3px 0 #DDE6DE">
        <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 21px; height: 21px; fill: none; stroke: #213D37; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round">
          <path d="M9 5H20V19H9L3 12L9 5Z"/>
          <path d="M12 9L17 15M17 9L12 15"/>
        </svg>
      </button>
    </section>

    <a href="Feedback-Tablet.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: center; gap: 9px; border-radius: 17px; background: #213D37; color: #FFF8EA; font-size: 16px; font-weight: 900; text-decoration: none; box-shadow: 0 4px 0 #102B26">
      检查答案
      <svg aria-hidden="true" viewBox="0 0 20 20" style="width: 17px; height: 17px; fill: none; stroke: #FFF8EA; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round">
        <path d="M4 10H16M11 5L16 10L11 15"/>
      </svg>
    </a>
  </main>

  <div style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 10px; font-weight: 800; color: #6D817A">
    <svg aria-hidden="true" viewBox="0 0 16 16" style="width: 13px; height: 13px; fill: none; stroke: #198B82; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round">
      <path d="M2 8C4 4 12 4 14 8C12 12 4 12 2 8Z"/>
      <circle cx="8" cy="8" r="2"/>
    </svg>
    慢慢想 · 不计时
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { entered: '', helperOpen: false };
  }

  renderVals() {
    const press = (digit) => {
      const next = (this.state.entered + digit).replace(/^0+(?=\\d)/, '').slice(0, 3);
      this.setState({ entered: next });
    };
    const digits = [1, 2, 3, 4, 5, 6, 7, 8, 9];
    const trail = Array.from({ length: 8 }, (_, index) => {
      const done = index < 5;
      const active = index === 5;
      return {
        label: '第 ' + (index + 1) + ' 题' + (active ? '，当前题目' : ''),
        petal: done ? '#F4B742' : active ? '#E85E77' : '#DCE7DB',
        center: done ? '#E85E77' : active ? '#F4B742' : '#B4C9B7',
        style: 'width: 22px; height: 24px; display: grid; place-items: center; border-radius: 8px; background: ' + (active ? '#FFF0C8' : 'transparent') + ';'
      };
    });
    return {
      entered: this.state.entered,
      helperOpen: this.state.helperOpen,
      trail,
      keys: digits.map((digit) => ({
        label: String(digit),
        press: () => press(String(digit)),
        style: 'height: 47px; border: 2px solid #D6E3DA; border-radius: 14px; background: #FFFFFF; color: #213D37; font-family: "Baloo 2", sans-serif; font-size: 22px; font-weight: 800; box-shadow: 0 3px 0 #DDE6DE'
      })),
      zeroPress: () => press('0'),
      clear: () => this.setState({ entered: '' }),
      backspace: () => this.setState({ entered: this.state.entered.slice(0, -1) }),
      toggleHelper: () => this.setState({ helperOpen: !this.state.helperOpen })
    };
  }
}
</script>
</body>
</html>
