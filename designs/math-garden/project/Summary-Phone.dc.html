<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>数学花园 · 手机本局总结</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+SC:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: "Noto Sans SC", sans-serif;
      color: #213D37;
      background-color: #FFF8EA;
      background-image: radial-gradient(#E9DDC8 0.9px, transparent 0.9px);
      background-size: 18px 18px;
    }
    button { font: inherit; cursor: pointer; }
    a { color: #213D37; }
    a:hover { color: #8E344D; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 11px">
  <svg aria-hidden="true" viewBox="0 0 180 140" style="position: absolute; width: 180px; height: 140px; right: -43px; bottom: -40px; opacity: 0.92">
    <path d="M18 137C41 101 70 95 98 108C73 131 56 142 29 149Z" fill="#F2C0C5"/>
    <path d="M66 143C91 111 121 106 150 118C127 141 101 152 82 157Z" fill="#B9DCC7"/>
    <path d="M123 143C145 120 167 116 190 126C173 144 150 154 132 159Z" fill="#F3D47A"/>
  </svg>
  <header style="min-height: 42px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="display: flex; align-items: center; gap: 9px">
      <div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 12px 12px 12px 4px; background: #E85E77; display: grid; place-items: center; box-shadow: 0 3px 0 #B73A57">
        <svg viewBox="0 0 30 30" style="width: 22px; height: 22px">
          <circle cx="15" cy="9" r="6" fill="#FFF5E7"/>
          <circle cx="9" cy="15" r="6" fill="#FFF5E7"/>
          <circle cx="21" cy="15" r="6" fill="#FFF5E7"/>
          <circle cx="15" cy="21" r="6" fill="#FFF5E7"/>
          <circle cx="15" cy="15" r="5" fill="#F4B742"/>
        </svg>
      </div>
      <div style="font-family: 'Baloo 2', 'Noto Sans SC', sans-serif; font-size: 21px; line-height: 21px; font-weight: 800; letter-spacing: -0.4px">数学花园</div>
    </div>
    <a href="Main.dc.html" aria-label="返回答题" style="width: 40px; height: 40px; border: 2px solid #CFE1D5; border-radius: 13px; background: #FFFFFFC9; display: grid; place-items: center; text-decoration: none">
      <svg aria-hidden="true" viewBox="0 0 20 20" style="width: 17px; height: 17px; fill: none; stroke: #213D37; stroke-width: 2.2; stroke-linecap: round">
        <path d="M5 5L15 15M15 5L5 15"/>
      </svg>
    </a>
  </header>

  <section style="padding: 18px 18px 17px; border: 2px solid #D7DFD5; border-radius: 25px; background: #FFFFFCF2; box-shadow: 0 5px 0 #E8DFCF; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden">
    <svg aria-hidden="true" viewBox="0 0 130 70" style="position: absolute; width: 130px; height: 70px; right: 3px; top: 8px; opacity: 0.7">
      <path d="M8 60C31 9 65 7 92 29C109 42 116 52 126 57" fill="none" stroke="#E0EBDD" stroke-width="2" stroke-dasharray="4 7" stroke-linecap="round"/>
      <circle cx="35" cy="22" r="4" fill="#F3D47A"/>
      <circle cx="74" cy="13" r="4" fill="#F2BBC2"/>
      <circle cx="112" cy="38" r="4" fill="#A8D4BD"/>
    </svg>
    <div style="font-size: 10px; font-weight: 900; letter-spacing: 0.08em; color: #198B82">本局完成</div>
    <div style="display: flex; align-items: flex-end; gap: 10px">
      <div style="font-family: 'Baloo 2', sans-serif; font-size: 64px; line-height: 52px; font-weight: 800; color: #E85E77">16</div>
      <div style="padding-bottom: 5px">
        <div style="font-family: 'Baloo 2', 'Noto Sans SC', sans-serif; font-size: 24px; line-height: 25px; font-weight: 800">朵花开了！</div>
        <div style="font-size: 11px; font-weight: 900; color: #71847C">共 18 题</div>
      </div>
    </div>
    <p style="margin: 0; max-width: 300px; font-size: 13px; line-height: 18px; font-weight: 700; color: #56766E">两个小难点，已经变成下次的线索。</p>
  </section>

  <section style="padding: 13px 14px; border: 2px solid #DDE8DC; border-radius: 20px; background: #F7FAF3; box-shadow: 0 3px 0 #E4EBDD">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
      <div style="font-family: 'Baloo 2', 'Noto Sans SC', sans-serif; font-size: 17px; line-height: 19px; font-weight: 800">你的题目地图</div>
      <div style="font-size: 9px; font-weight: 900; color: #6C8178">18 个站点</div>
    </div>
    <div style="margin-top: 8px; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{ questionMap }}" as="item" hint-placeholder-count="18">
        <div aria-label="{{ item.label }}" style="{{ item.style }}">
          <svg viewBox="0 0 20 20" aria-hidden="true" style="width: 18px; height: 18px">
            <circle cx="10" cy="7" r="4.3" fill="{{ item.petal }}"/>
            <circle cx="6.4" cy="10.1" r="4.3" fill="{{ item.petal }}"/>
            <circle cx="13.6" cy="10.1" r="4.3" fill="{{ item.petal }}"/>
            <circle cx="10" cy="13" r="4.3" fill="{{ item.petal }}"/>
            <circle cx="10" cy="10" r="3.1" fill="{{ item.center }}"/>
          </svg>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="padding: 14px 15px; border: 2px solid #D4E4D8; border-radius: 20px; background: #F0F8F1; display: flex; flex-direction: column; gap: 9px; box-shadow: 0 3px 0 #E1EADF">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="font-family: 'Baloo 2', 'Noto Sans SC', sans-serif; font-size: 18px; line-height: 20px; font-weight: 800">今天长出的本领</div>
      <div style="font-size: 10px; font-weight: 900; color: #41806D">开局很棒</div>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 11px">
      <div>
        <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 10px; font-weight: 900"><span>两位数加法</span><span>5 / 5</span></div>
        <div style="height: 7px; margin-top: 5px; border-radius: 999px; background: #D9E9DB; overflow: hidden"><div style="width: 100%; height: 100%; background: #198B82"></div></div>
      </div>
      <div>
        <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 10px; font-weight: 900"><span>两位数减法</span><span>5 / 5</span></div>
        <div style="height: 7px; margin-top: 5px; border-radius: 999px; background: #D9E9DB; overflow: hidden"><div style="width: 100%; height: 100%; background: #198B82"></div></div>
      </div>
      <div>
        <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 10px; font-weight: 900"><span>找缺失数</span><span>3 / 4</span></div>
        <div style="height: 7px; margin-top: 5px; border-radius: 999px; background: #F1DED7; overflow: hidden"><div style="width: 75%; height: 100%; background: #E85E77"></div></div>
      </div>
      <div>
        <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 10px; font-weight: 900"><span>进位加法</span><span>3 / 4</span></div>
        <div style="height: 7px; margin-top: 5px; border-radius: 999px; background: #F1DED7; overflow: hidden"><div style="width: 75%; height: 100%; background: #E85E77"></div></div>
      </div>
    </div>
  </section>

  <section style="padding: 13px 14px; border: 2px solid #F0D6D5; border-radius: 21px; background: #FFF4F1; display: flex; align-items: center; gap: 12px; box-shadow: 0 3px 0 #EADAD2">
    <div aria-hidden="true" style="width: 38px; height: 40px; flex: 0 0 auto">
      <svg viewBox="0 0 50 56" style="width: 38px; height: 40px">
        <path d="M25 22C14 22 9 29 11 41C13 50 20 54 26 54C34 54 40 48 40 38C40 28 35 22 25 22Z" fill="#E85E77"/>
        <circle cx="20" cy="34" r="2.3" fill="#213D37"/>
        <circle cx="32" cy="34" r="2.3" fill="#213D37"/>
        <path d="M22 41C24 43 28 43 30 41" fill="none" stroke="#213D37" stroke-width="2" stroke-linecap="round"/>
        <path d="M20 23C16 17 18 11 23 6C27 12 27 18 24 23" fill="#55B79D"/>
        <path d="M27 22C31 15 36 14 41 16C39 22 34 25 28 24" fill="#198B82"/>
      </svg>
    </div>
    <div style="min-width: 0; flex-grow: 1">
      <div style="font-size: 9px; font-weight: 900; letter-spacing: 0.06em; color: #A1495D">小芽的下次提醒</div>
      <div style="font-family: 'Baloo 2', 'Noto Sans SC', sans-serif; font-size: 19px; line-height: 21px; font-weight: 800">记得找一个新的十。</div>
      <div style="margin-top: 3px; font-size: 10px; line-height: 14px; font-weight: 800; color: #6B5555">7 + 6 = 13，要把 1 个十进上去。</div>
    </div>
    <div style="padding: 7px 8px; border-radius: 11px; background: #FFFFFF; font-family: 'Baloo 2', sans-serif; font-size: 18px; font-weight: 800; color: #167C73; white-space: nowrap">10 + 3</div>
  </section>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <a href="Main.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 9px; border-radius: 16px; background: #213D37; color: #FFF8EA; font-size: 14px; font-weight: 900; text-decoration: none; box-shadow: 0 4px 0 #102B26">
      再种一座新花园
      <svg aria-hidden="true" viewBox="0 0 20 20" style="width: 17px; height: 17px; fill: none; stroke: #FFF8EA; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round">
        <path d="M4 10H16M11 5L16 10L11 15"/>
      </svg>
    </a>
    <a href="Feedback-Tablet.dc.html" style="height: 43px; display: flex; align-items: center; justify-content: center; border: 2px solid #D2DED3; border-radius: 15px; background: #FFFFFF; color: #315D50; font-size: 12px; font-weight: 900; text-decoration: none; box-shadow: 0 3px 0 #DDE6DC">复习 2 道易错题</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const misses = new Set([10, 16]);
    const questionMap = Array.from({ length: 18 }, (_, index) => {
      const missed = misses.has(index);
      return {
        label: '第 ' + (index + 1) + ' 题，' + (missed ? '再练一次' : '答对'),
        petal: missed ? '#F1B6B6' : '#A8D6BC',
        center: missed ? '#E85E77' : '#198B82',
        style: 'height: 27px; display: grid; place-items: center; border-radius: 8px; background: ' + (missed ? '#FFF0EE' : '#F0F8F2') + ';'
      };
    });
    return { questionMap };
  }
}
</script>
</body>
</html>
